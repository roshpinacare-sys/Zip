<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחסל לבנים — SAOS GAMES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#09090b; color:#e4e4e7; font-family:'Segoe UI',system-ui,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  h1 { font-size:22px; color:#d4af37; }
  #hud { display:flex; gap:18px; font-size:14px; }
  #hud b { color:#a78bfa; }
  canvas { background:#101014; border:1px solid #27272a; border-radius:12px; max-width:94vw; cursor:none; touch-action:none; }
  .hint { font-size:12px; color:#71717a; }
  a.back { color:#a1a1aa; font-size:13px; text-decoration:none; border:1px solid #27272a; padding:6px 16px; border-radius:99px; }
</style>
</head>
<body>
  <h1>🧱 מחסל לבנים</h1>
  <div id="hud"><span>לבנים <b id="br">0</b></span><span>שלב <b id="lv">1</b></span><span>ניקוד <b id="sc">0</b></span></div>
  <canvas id="cv" width="420" height="440"></canvas>
  <p class="hint">הזז את העכבר / האצבע · הכדור מאיץ עם כל לבנה</p>
  <a class="back" href="index.html">↩ למגרש</a>
<script>
(function(){
  var cv=document.getElementById('cv'),x=cv.getContext('2d'),W=420,H=440;
  var pad,ball,br,sc,lv,run=false;
  function init(lv0){
    lv=lv0||1;sc=sc||0;pad={w:78,h:10,x:W/2-39,y:H-24};
    ball={x:W/2,y:H-60,r:6,vx:(Math.random()<.5?-1:1)*(2.1+lv*.4),vy:-(2.6+lv*.4)};
    br=[];var cols=7,rows=3+Math.min(3,lv-1),cw=(W-24)/cols;
    var hues=['#d4af37','#a78bfa','#7f8cff','#5fd4a0','#e4899a','#f2c14e'];
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)br.push({x:12+c*cw,y:44+r*22,w:cw-6,h:16,c:hues[r%hues.length],p:Math.random()<.12});
    document.getElementById('br').textContent=br.length;
    document.getElementById('lv').textContent=lv;
    document.getElementById('sc').textContent=sc;
    run=false;draw();
  }
  function mvPad(cx){var r=cv.getBoundingClientRect();pad.x=Math.max(0,Math.min(W-pad.w,(cx-r.left)*(W/r.width)-pad.w/2))}
  cv.addEventListener('mousemove',function(e){mvPad(e.clientX)});
  cv.addEventListener('touchmove',function(e){mvPad(e.touches[0].clientX)},{passive:true});
  cv.addEventListener('click',function(){run=true});
  cv.addEventListener('touchstart',function(e){mvPad(e.touches[0].clientX);run=true},{passive:true});
  function loop(){
    if(run){
      ball.x+=ball.vx;ball.y+=ball.vy;
      if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;
      if(ball.y<ball.r)ball.vy*=-1;
      if(ball.vy>0&&ball.y>pad.y-ball.r&&ball.y<pad.y+pad.h&&ball.x>pad.x&&ball.x<pad.x+pad.w){
        ball.vy=-Math.abs(ball.vy);
        ball.vx+=((ball.x-(pad.x+pad.w/2))/(pad.w/2))*.9;
      }
      if(ball.y>H){sc=Math.max(0,sc-10);init(1);return}
      for(var i=0;i<br.length;i++){
        var b=br[i];
        if(ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){
          br.splice(i,1);sc+=5;ball.vy*=-1;
          if(Math.abs(ball.vx)<6)ball.vx*=1.03;if(Math.abs(ball.vy)<7)ball.vy*=1.03;
          if(Math.random()<b.p){pad.w=Math.max(56,pad.w+10);setTimeout(function(){pad.w=78},9000)}
          document.getElementById('br').textContent=br.length;
          document.getElementById('sc').textContent=sc;
          break;
        }
      }
      if(!br.length){lv++;init(lv);return}
    }
    draw();requestAnimationFrame(loop);
  }
  function draw(){
    x.fillStyle='#101014';x.fillRect(0,0,W,H);
    br.forEach(function(b){x.fillStyle=b.c;x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle='rgba(255,255,255,.12)';x.fillRect(b.x,b.y,b.w,4)});
    x.fillStyle='#d4af37';x.fillRect(pad.x,pad.y,pad.w,pad.h);
    x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fillStyle='#a78bfa';x.fill();
    if(!run){x.fillStyle='#e4e4e7';x.font='14px sans-serif';x.textAlign='center';x.fillText('הקש/הקשי או גע במסך להתחלה',W/2,H/2)}
  }
  sc=0;init(1);loop();
})();
</script>
</body>
</html>
