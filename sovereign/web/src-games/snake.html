<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הנחש — SAOS GAMES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#09090b; color:#e4e4e7; font-family:'Segoe UI',system-ui,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; touch-action:none; }
  h1 { font-size:22px; color:#d4af37; }
  #hud { display:flex; gap:18px; font-size:14px; }
  #hud b { color:#a78bfa; }
  canvas { background:#101014; border:1px solid #27272a; border-radius:12px; max-width:92vw; }
  .hint { font-size:12px; color:#71717a; }
  a.back { color:#a1a1aa; font-size:13px; text-decoration:none; border:1px solid #27272a; padding:6px 16px; border-radius:99px; }
</style>
</head>
<body>
  <h1>🐍 הנחש</h1>
  <div id="hud"><span>ניקוד <b id="sc">0</b></span><span>שיא <b id="hi">0</b></span></div>
  <canvas id="cv" width="360" height="360"></canvas>
  <p class="hint">חצים / WASD במקלדת · החלקת אצבע בנייד</p>
  <a class="back" href="index.html">↩ למגרש</a>
<script>
(function(){
  var cv=document.getElementById('cv'),x=cv.getContext('2d'),N=18,C=20;
  var s,d,dir,nd,score,hi=+(localStorage.snakeHi||0),dead,timer,spd;
  document.getElementById('hi').textContent=hi;
  function reset(){s=[{x:9,y:9},{x:10,y:9},{x:11,y:9}];dir={x:-1,y:0};nd=null;score=0;dead=false;spd=170;place();document.getElementById('sc').textContent=0;go();}
  function place(){do{f={x:~~(Math.random()*N),y:~~(Math.random()*N)}}while(s.some(function(p){return p.x==f.x&&p.y==f.y}))}
  function go(){clearTimeout(timer);timer=setTimeout(tick,spd)}
  function tick(){
    if(nd){dir=nd;nd=null}
    var h={x:(s[0].x+dir.x+N)%N,y:(s[0].y+dir.y+N)%N};
    if(s.some(function(p){return p.x==h.x&&p.y==h.y})){dead=true;draw();return}
    s.unshift(h);
    if(h.x==f.x&&h.y==f.y){score+=10;document.getElementById('sc').textContent=score;if(score>hi){hi=score;localStorage.snakeHi=hi;document.getElementById('hi').textContent=hi}place();if(spd>80)spd-=3}else{s.pop()}
    draw();go();
  }
  function draw(){
    x.fillStyle='#101014';x.fillRect(0,0,360,360);
    x.fillStyle='#a78bfa';x.beginPath();x.arc(f.x*C+C/2,f.y*C+C/2,7,0,7);x.fill();
    s.forEach(function(p,i){x.fillStyle=i?'#3f6d4e':'#d4af37';x.fillRect(p.x*C+1,p.y*C+1,C-2,C-2)});
    if(dead){x.fillStyle='rgba(9,9,11,.78)';x.fillRect(0,0,360,360);x.fillStyle='#d4af37';x.font='bold 26px sans-serif';x.textAlign='center';x.fillText('נגמר!',180,165);x.fillStyle='#e4e4e7';x.font='14px sans-serif';x.fillText('ניקוד: '+score+' · הקש/הקשי להתחלה מחדש',180,200)}
  }
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(dead&&(k==' '||k=='Enter')){reset();return}
    var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[k];
    if(m){e.preventDefault();if(!dead&&!(m[0]==-dir.x&&m[1]==-dir.y))nd={x:m[0],y:m[1]}}
  });
  cv.addEventListener('click',function(){if(dead)reset()});
  var ts=null;
  cv.addEventListener('touchstart',function(e){ts={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
  cv.addEventListener('touchend',function(e){
    if(!ts)return;var dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;
    if(Math.abs(dx)<12&&Math.abs(dy)<12){if(dead)reset();return}
    var m=Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1];
    if(!dead&&!(m[0]==-dir.x&&m[1]==-dir.y))nd={x:m[0],y:m[1]};
  },{passive:true});
  reset();
})();
</script>
</body>
</html>
