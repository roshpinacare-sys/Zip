# office-heartbeat — Fleet HQ never goes silent again.
#
# Owner directive (trace 1a12c566036dc565): "המשרד בfleet חשוב מאוד — הוא חייב
# לשרת את הרשת והריבונות, לשפר את עצמו פלאים ולעבוד תמיד, וגם להעלות אותו
# לדף לשיווק." This workflow is that law, executed:
#   · every 2 hours a real crew shift boots (live mode — keyless brains +
#     GitHub Models via the built-in token; brain-chain failover is built-in)
#   · the office works on the Domain books, self-schedules, self-resolves
#   · office memory/journal/tasks persist back INTO Domain (git = the body)
#   · a captured office-state JSON lands in FleetHQ → the public Domain page
#     renders the office LIVE (marketing that never goes stale)
#
# Honesty law: the workflow commits only what the office actually wrote.
# No shift happened → NO-CHANGE is reported, nothing is faked.

name: office-heartbeat

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: office-heartbeat
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout FleetHQ (office code)
        uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: clone Domain (the books — with persistence rights)
        env:
          GIT_PAT: ${{ secrets.OFFICE_GIT_PAT }}
        run: |
          if [ -n "$GIT_PAT" ]; then
            git clone --depth 5 "https://x-access-token:${GIT_PAT}@github.com/roshpinacare-sys/Domain.git" mini-services/agent-hq/Domain
          else
            echo "::warning::OFFICE_GIT_PAT not set — cloning public Domain; persistence push will be skipped (honest no-write)"
            git clone --depth 5 "https://github.com/roshpinacare-sys/Domain.git" mini-services/agent-hq/Domain
          fi

      - name: install dependencies (root + agent-hq)
        run: |
          bun install
          cd mini-services/agent-hq && bun install

      - name: boot the office (live crew, bounded shift)
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          AGENT_HQ_FLEET_DIR: ${{ github.workspace }}
        run: |
          cd mini-services/agent-hq
          [ -f .env ] || cp .env.example .env
          AGENT_HQ_PORT=3010 AGENT_HQ_MODE=live nohup bash run-office.sh > /tmp/office-boot.log 2>&1 &
          echo $! > /tmp/office.pid
          echo "office pid: $(cat /tmp/office.pid)"
          sleep 50   # patrol arms itself 40s after boot (anti-fixation operator)

      - name: capture office state (early)
        run: bun tools/office-state-capture.ts 3010 /tmp/office-state-early.json 90000

      - name: let the crew work
        run: |
          sleep 300
          if ! kill -0 "$(cat /tmp/office.pid)" 2>/dev/null; then
            echo "::warning::foreman process exited early — boot log:"; tail -40 /tmp/office-boot.log
          fi

      - name: capture office state (final)
        run: bun tools/office-state-capture.ts 3010 /tmp/office-state-final.json 30000

      - name: stop the shift
        run: |
          kill "$(cat /tmp/office.pid)" 2>/dev/null || true
          sleep 3
          pkill -f "bun run index.ts" 2>/dev/null || true

      - name: persist office memory into Domain (git = the body)
        env:
          GIT_PAT: ${{ secrets.OFFICE_GIT_PAT }}
        run: |
          cd mini-services/agent-hq/Domain
          git config user.name  "fleet-office-bot"
          git config user.email "agents@saos.local"
          # whitelist only what the office actually writes (never the PID lock)
          for f in agents/office-memory.json agents/office-tasks.json agents/office-events.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "NO-CHANGE: office wrote nothing new into the books this shift (honest)"
          else
            if [ -z "$GIT_PAT" ]; then echo "SKIP-PUSH: no PAT secret — changes stay local (honest)"; exit 0; fi
            git commit -m "office-heartbeat: crew shift persisted — memory/journal/tasks [skip ci]"
            git -c rebase.autoStash=true pull --rebase -q origin main || true
            git push -q origin main && echo "PERSISTED: office memory committed to Domain"
          fi

      - name: publish office state into FleetHQ (the page eats this)
        run: |
          mkdir -p office/state
          cp /tmp/office-state-final.json office/state/office-state.json
          tail -60 /tmp/office-boot.log > office/state/last-boot.log 2>/dev/null || true
          # fleet mirror written by the office itself (AGENT_HQ_FLEET_DIR)
          [ -f receipts/office-state-mirror.json ] && echo "mirror: present" || echo "mirror: absent (demo-mode honest)"
          git config user.name  "fleet-office-bot"
          git config user.email "agents@saos.local"
          git add office/state/ receipts/office-state-mirror.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "NO-CHANGE: nothing new to publish"
          else
            git commit -m "office-heartbeat: public office state captured [skip ci]"
            git -c rebase.autoStash=true pull --rebase -q origin main || true
            git push -q origin main && echo "PUBLISHED: office state live for the page"
          fi

      - name: shift summary
        run: |
          {
            echo "## Office heartbeat — crew shift"
            echo ""
            echo "| measure | value |"
            echo "|---|---|"
            echo "| captured at | $(python3 -c "import json;print(json.load(open('/tmp/office-state-final.json'))['capturedAt'])") |"
            echo "| backend | $(python3 -c "import json;print(json.load(open('/tmp/office-state-final.json'))['backend'])") |"
            echo "| agents on desks | $(python3 -c "import json;print(len(json.load(open('/tmp/office-state-final.json'))['agents']))") |"
            echo "| tasks on wall | $(python3 -c "import json;s=json.load(open('/tmp/office-state-final.json'));print(', '.join(f\"{t['id']}:{t['status']}\" for t in s['tasks'][:6]) or 'none')") |"
            echo "| events | $(python3 -c "import json;print(json.load(open('/tmp/office-state-final.json'))['counts'])") |"
          } >> "$GITHUB_STEP_SUMMARY"
