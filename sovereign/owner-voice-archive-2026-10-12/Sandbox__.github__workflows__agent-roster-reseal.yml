# ═══════════════════════════════════════════════════════════════════════════
# AGENT ROSTER RESEAL — שחזור-זהויות-הצי-מהגיט-בלבד (T-47 · agent-2)
# ═══════════════════════════════════════════════════════════════════════════
# הבעיה-שנמדדה (trace 1a121d0d81d8cd21): מעטפות-התיבה (agents/inbox.sealed.json)
# נמצאו ריקות — והטוקנים-המקומיים מתו-עם-הסנדבוקס. סוכן-חדש-על-מכונה-חדשה
# לא-היה-יכול-לשחזר-את-זהותו-מהגיט = תלות-במפעיל. זו-הפרה-של-חוק-הריבונות.
#
# התיקון: הטוקנים-חיים-ב-repo-secrets (SBX_AGENT_TOKEN_AGENT1..5) — הריצה-הזו
# קוראת-אותם-ב-runner-בלבד, חותמת-מחדש-את-המעטפות-דרך-הכלי-של-agent-3
# (agents/seal-inbox.mjs — אפס-שינוי-בקוד-שלו), ומחזירה-את-היכולת:
#   "כל-סוכן-עם-טוקן-אחד-פותח-את-מעטפתו-ומוצא-שם-את-כל-הרוסטר".
# הטוקנים-מעולם-לא-נדפסים · לא-נכתבים-בתוך-הריפו · נמחקים-בסוף-הריצה.
# ═══════════════════════════════════════════════════════════════════════════
name: agent-roster-reseal

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "סיבה (שגרה/חשד/שחזור-אחרי-מחיקת-סנדבוקס)"
        required: false
        default: "scheduled reseal"

permissions:
  contents: write

concurrency:
  group: agent-roster-reseal
  cancel-in-progress: false

jobs:
  reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: materialize tokens (runner-env only, /tmp, 600)
        env:
          SBX_AGENT_TOKEN_AGENT1: ${{ secrets.SBX_AGENT_TOKEN_AGENT1 }}
          SBX_AGENT_TOKEN_AGENT2: ${{ secrets.SBX_AGENT_TOKEN_AGENT2 }}
          SBX_AGENT_TOKEN_AGENT3: ${{ secrets.SBX_AGENT_TOKEN_AGENT3 }}
          SBX_AGENT_TOKEN_AGENT4: ${{ secrets.SBX_AGENT_TOKEN_AGENT4 }}
          SBX_AGENT_TOKEN_AGENT5: ${{ secrets.SBX_AGENT_TOKEN_AGENT5 }}
        run: |
          set -euo pipefail
          T="$(mktemp)"; chmod 600 "$T"
          i=1
          while [ $i -le 5 ]; do
            v="$(printenv "SBX_AGENT_TOKEN_AGENT$i" || true)"
            if [ -n "$v" ]; then printf 'AGENT_%d_TOKEN=%s\n' "$i" "$v" >> "$T"; fi
            i=$((i+1))
          done
          n="$(grep -c . "$T" || true)"
          echo "tokens materialized: $n (values never printed)"
          [ "$n" -ge 1 ] || { echo "NO TOKENS IN SECRETS — honest failure, nothing changed"; exit 1; }
          echo "TOKENS_FILE=$T" >> "$GITHUB_ENV"

      - name: seal inbox (agent-3's tool, unchanged)
        run: |
          set -euo pipefail
          SBX_TOKENS_FILE="$TOKENS_FILE" node agents/seal-inbox.mjs

      - name: leak-scan (fail-closed)
        run: |
          set -euo pipefail
          echo "scanning agents/inbox.sealed.json for plaintext token shapes…"
          # טוקן = 43 תווים base64url; המעטפות מכילות base64 — לכן-הסריקה:
          # אסור-ששורה-תתחיל-ב-AGENT_\d_TOKEN= · אסור-מחרוזת github_pat_/ghp_
          if grep -nE "AGENT_[0-9]_TOKEN=|github_pat_|ghp_[A-Za-z0-9]{20,}" agents/inbox.sealed.json; then
            echo "LEAK SHAPE FOUND — refusing to commit"; exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("agents/inbox.sealed.json"))
          assert d.get("schema") == "sanbox-agent-inbox/1", "bad schema"
          assert len(d.get("envelopes", [])) >= 1, "empty envelopes — refusing"
          print(f"envelopes: {len(d['envelopes'])} · kdf: {d.get('kdf')} · iter: {d.get('iterations')}")
          PY

      - name: roundtrip self-verify (roster recovery proof)
        env:
          SBX_AGENT_TOKEN_AGENT1: ${{ secrets.SBX_AGENT_TOKEN_AGENT1 }}
        run: |
          set -euo pipefail
          SBX_OPEN_TOKEN="$SBX_AGENT_TOKEN_AGENT1" node agents/seal-inbox.mjs --open --id agent-1

      - name: commit + push (rebase-safe, scoped to agents/inbox only)
        run: |
          set -euo pipefail
          git config user.name "sandbox-agents"
          git config user.email "sandbox-agents@users.noreply.github.com"
          git add agents/inbox.sealed.json
          if git diff --cached --quiet; then
            echo "no envelope changes — nothing to commit"; exit 0
          fi
          git commit -m "[agents] roster-reseal (${{ inputs.reason || 'scheduled' }}): $(date -u +%FT%TZ)"
          ok=""
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          [ -n "$ok" ] || { echo "push failed after 3 rebase attempts — honest failure"; exit 1; }
          echo "pushed — roster recoverable from git again"

      - name: shred tokens
        if: always()
        run: |
          [ -n "${TOKENS_FILE:-}" ] && rm -f "$TOKENS_FILE"
          echo "tokens shredded (if: always — shred even on failure)"
