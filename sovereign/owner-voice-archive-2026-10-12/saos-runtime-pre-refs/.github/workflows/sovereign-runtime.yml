  pulse:
    needs: heartbeat
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Fleet relay — guarded dispatch to closer + decider + THE GRID + evolution (T-65 grid-never-down, fail-soft)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          relay() {
            local repo="$1" wf="$2" minAge="${3:-15}" last age code
            last=$(curl -s -H "Authorization: token ${GH_PAT}" "https://api.github.com/repos/roshpinacare-sys/${repo}/actions/workflows/${wf}/runs?per_page=1" | jq -r '.workflow_runs[0].created_at // empty')
            if [ -n "$last" ]; then
              age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
              if [ "$age" -lt "$minAge" ]; then echo "RELAY[${repo}/${wf}]: SKIPPED (ran ${age}min ago < ${minAge} — no-noise)"; return; fi
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: token ${GH_PAT}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/roshpinacare-sys/${repo}/actions/workflows/${wf}/dispatches" -d '{"ref":"main"}')
            echo "RELAY[${repo}/${wf}]: dispatch http:${code} (fail-soft — the pulse chain never depends on the relay)"
          }
          relay "FleetHQ" "opens-closer.yml"
          relay "FleetHQ" "sovereign-decider.yml"
          relay "saos-runtime" "fee-engine.yml" 245
          relay "saos-runtime" "sovereign-evolution.yml" 1500

      - name: Deterministic pulse — self-reschedule the next heartbeat
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 900
          # T-22c hardening (grid-never-down): one transient dispatch failure must not kill
          # the pulse chain — 3 attempts with backoff before the beat reports dead. The hourly
          # cron backstop remains the final revive for infra/billing deaths where NOTHING runs.
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/dispatch.out -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/roshpinacare-sys/saos-runtime/actions/workflows/sovereign-runtime.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "dispatch attempt $i http:$code"
            [ "$code" = "204" ] && break
            sleep 30
          done
          [ "$code" = "204" ] || { cat /tmp/dispatch.out; exit 1; }

