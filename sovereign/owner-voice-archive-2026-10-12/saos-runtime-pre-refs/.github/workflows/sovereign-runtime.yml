          # STEEM_ACTIVE_WIF, chain-judge it and deliver it to the signer (0600).
          # Absent secret = the burst ticks honestly UNARMED (artery-grid law
          # law-grid-exec-alive holds the red until then). The heavy vault census
          # is NOT run here (measured-empty 2026-10-12) — heartbeat stays lean.
          if [ -n "$STEEM_ACTIVE_WIF" ]; then
