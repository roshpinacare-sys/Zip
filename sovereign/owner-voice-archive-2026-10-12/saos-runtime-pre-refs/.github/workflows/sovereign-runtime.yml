        env:
          CI_EXEC_ARMED: ${{ secrets.CI_EXEC_ARMED }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}

      # Z-20-e (exec-20 · owner=active): THE HIVE BEAT — the user's standing order
      # "תמצא פתרון להזרים את הhive" closed at the WORKFLOW layer (the engine's own
      # hive modules are untouched — T-65 territory): hiveCustody unlocks the vault
      # via vault-custody (STEEM_VAULT_PASSES is on the job env) and chain-judges
