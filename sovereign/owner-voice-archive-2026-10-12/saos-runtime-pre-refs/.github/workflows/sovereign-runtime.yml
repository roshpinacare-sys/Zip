              } catch (e) { console.log("hive-social failed (honest):", String(e && e.message || e).slice(0, 140)); }
            } else {
              console.log("hive lanes skipped — no chain-verified hive custody (fail-closed, honest)");
            }
          } catch (e) {
            console.log("hive beat failed (honest, fail-soft):", String(e && e.message || e).slice(0, 160));
          }
          '
      - name: Commit state back (FF-only, no force, ever · honest yield to the alive custodian — T-58 fix)
        working-directory: engine
        run: |
          git add -A mini-services/saos-engine/state mini-services/saos-engine/content/sent
          if git diff --cached --quiet; then
            echo "no state changes this heartbeat"
          else
            git commit -m "SAOS-runtime-ci: heartbeat state (offline conversation + content) [ci]"
            ok=0; yielded=0
            for i in 1 2 3 4 5; do
              if git push origin saos-cockpit; then ok=1; break; fi
              echo "push raced with the sandbox custodian — fetch + rebase, retry $i"
              git status --porcelain | head -10 || true
              git stash push --include-untracked -m "runner residual between heartbeats (state already committed)" || true
              git fetch origin saos-cockpit
              if git rebase origin/saos-cockpit; then
                sleep $((i * 5))
                continue
              fi
              # rebase failed: a real conflict (rebase in progress) OR a
              # refusal to start ("cannot rebase: unstaged changes" — a stash
              # failure left residuals). Both mean the branch-of-record moved
              # under this heartbeat: yield honestly either way. The abort is
              # guarded — a bare `git rebase --abort` with no rebase in
              # progress exits 128 and would kill the step (measured 15:34Z
              # run 38151872541: exactly that, on top of the conflict itself).
              if git rebase --abort 2>/dev/null; then
                echo "rebase CONFLICT on machine-generated state (events/exec/custody snapshots) — measured T-58 root cause: the always-on custodian engine rewrote the same state files while this heartbeat ran."
                echo "A conflict is PROOF the custodian is alive and writing. The custodian is the branch-of-record: this runner's state commit yields honestly. No force, ever. Custodian keeps the record."
              else
                echo "rebase refused to start (unstaged residuals survived the stash) — yielding honestly too: the state commit stays local, the custodian branch-of-record is untouched, no force."
              fi
              yielded=1
              break
            done
            if [ "$ok" != "1" ] && [ "$yielded" != "1" ]; then
              echo "state push-back failed after 5 retries with NO conflict — unexpected; fail-closed"
              exit 1
            fi
          fi

      - name: Summary (verdicts only — this page is public)
        if: always()
        working-directory: engine/mini-services/saos-engine
        run: |
          {
