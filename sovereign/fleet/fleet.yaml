apiVersion: sovereign.io/v1alpha1
kind: FleetService
metadata:
  name: decision-brain
  notes: laya engine (r163). OOM lesson of r163 is this manifest — lazy load only,
    idle reaper as the suspend/resume route, 2GB admission ceiling.
spec:
  port: 3047
  healthPath: /health
  entry: mini-services/decision-brain (python venv)
  workspaces:
    - name: laya-venv
      path: /home/z/laya-eval/venv
      notes: warm workspace — torch 2.14.1+cpu + laya 0.3.24 preinstalled
    - name: hf-checkpoint-cache
      path: /home/z/laya-eval/hf-cache
      notes: warm workspace — 644MB multilingual checkpoint, offline after download
  resources:
    limits: { memoryMB: 2048 }
  suspendPolicy: idle-unload-120s
  phase: Suspended   # resident model load OOMs under full fleet; wake = POST /decide
---
