# Fleet manifest of record — r164
# Modeled on ax.io/v1alpha1 (https://github.com/google/ax) — Task/Workspace/Model
# concepts adapted to our single-host fleet. Declared-vs-actual is audited by
# scripts/fleet-manifests-audit.mjs; evidence lands in sovereign/fleet/audit-latest.json.
# Rule FLO-1: a service without a manifest here is unmanaged. Rule FLO-2: no
# admission without a declared memory limit.
apiVersion: sovereign.io/v1alpha1
kind: FleetService
metadata:
  name: home
  notes: Next.js dev server + gateway surface (the only operator-facing route)
spec:
  port: 3000
  healthPath: /api/money
  entry: bun run dev (repo root)
  resources:
    limits: { memoryMB: 2000 }   # measured 1596MB in first audit (r164)
  phase: Running
---
apiVersion: sovereign.io/v1alpha1
kind: FleetService
metadata:
  name: money-mover
spec:
  port: 3034
  healthPath: /   # identity+state served at root; /health is 404 here
  entry: mini-services/money (bun)
  resources:
    limits: { memoryMB: 300 }
  phase: Running
