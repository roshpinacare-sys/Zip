# CONTROL-CENTER-BUILD - שעת האיכות של מרכז הבקרה
#
# מרכז הבקרה הוא אפליקציית ה-Next.js של הרשת. הסוכן מתקין תלויות
# מהנעילה הקפואה, מריץ בדיקת טיפוסים מלאה ובילד ייצור. כל שלב שנכשל
# נרשם בכנות בדוח - אדום אמיתי עדיף על ירוק מזויף. דוח ל-agent/status.json.

name: control-center-build

on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-center-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run the build gate
        run: |
          set -u
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERDICT="FAIL"
          REASON=""

          if [ ! -f package.json ]; then
            echo "no package.json - nothing to build"; exit 1
          fi

          # 1) התקנה מהנעילה הקפואה
          INSTALL="fail"
          if [ -f bun.lock ]; then
            if bun install --frozen-lockfile; then INSTALL="pass"; fi
          else
            if bun install; then INSTALL="pass"; fi
          fi
          if [ "$INSTALL" = "fail" ]; then
            REASON="dependency install failed"
          fi

          # 2) ג'נרוט לקוח ה-Prisma אם קיים
          PRISMA="skipped"
          if [ "$INSTALL" = "pass" ] && [ -f prisma/schema.prisma ]; then
            if bunx prisma generate; then PRISMA="pass"; else PRISMA="fail"; fi
          fi

          # 3) בדיקת טיפוסים מלאה
          TSC="skipped"
          if [ "$INSTALL" = "pass" ] && [ -f tsconfig.json ]; then
            if bunx tsc --noEmit; then TSC="pass"; else TSC="fail"; fi
          fi

          # 4) בילד ייצור - שומר ה-DB של הריפו מקבל רק את custom.db שלו (fail-closed)
          BUILD="skipped"
          if [ "$INSTALL" = "pass" ] && grep -q '"build"' package.json; then
            export DATABASE_URL="file:./db/custom.db"
            [ -f .env.example ] && cp .env.example .env
            mkdir -p db
            [ -f db/custom.db ] || touch db/custom.db
            if [ "$PRISMA" = "pass" ]; then
              bunx prisma db push --skip-generate --accept-data-loss > /dev/null 2>&1 || true
            fi
            if bunx next build; then BUILD="pass"; else BUILD="fail"; fi
          fi

          if [ "$INSTALL" = "pass" ] && [ "$TSC" != "fail" ] && [ "$BUILD" != "fail" ] && [ "$PRISMA" != "fail" ]; then
            VERDICT="PASS"; REASON="install, typecheck and build all pass"
          else
            REASON="install=$INSTALL prisma=$PRISMA tsc=$TSC build=$BUILD"
          fi

          mkdir -p agent
          cat > agent/status.json <<EOF
          {
           "agent": "control-center-build",
           "generatedAt": "$NOW",
           "verdict": "$VERDICT",
           "checks": {
            "install": "$INSTALL",
            "prismaGenerate": "$PRISMA",
            "typecheck": "$TSC",
            "productionBuild": "$BUILD"
           },
           "reason": "$REASON"
          }
          EOF
          git config user.name "control-center-build[bot]"
          git config user.email "control-center-build[bot]@users.noreply.github.com"
          git add agent/status.json
          if git diff --cached --quiet agent/status.json; then
            echo "status unchanged - no commit"
          else
            git commit -m "control-center-build: $VERDICT at $NOW"
            git push
          fi
          echo "verdict: $VERDICT ($REASON)"
          [ "$VERDICT" = "PASS" ] || exit 1
