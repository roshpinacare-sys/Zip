# KEY-VERIFY - בדיקת המפתח שהמפעיל מוסיף בגיטהאב (R38).
#
# מצב כנה בבית החדש (2026-09-20): ה-workflow מוכן ורדום. הפעלתו דורשת
# את הסוד HEADCORNER - מפתח המפעיל - שאותו מזין המפעיל בלבד בכספת
# (Settings > Secrets and variables > Actions > HEADCORNER). עד שיוזן,
# הרצה ידנית תיכשל בכנות ("HEADCORNER missing") בלי לגעת בשום דבר.
# רק ריצות Actions של הריפו הזה יכולות לקרוא את הסוד - הסוכן גוזר את
# המפתח-הציבורי, משווה מול הרשות החיה של @headcorner בשרשרת, ומפרסם
# קבלה כנה (receipts/key-check.json). בהתאמה מלאה בלבד - הוא מאטם את
# ה-WIF אל כספת ריפו-המנוע (saos-dex/STEEM_ACTIVE_WIF) ומזניק את הגריד.
#
# r70 (2026-09-21): המפעיל מסר מפתח לכספת זו תחת השם MAIN_KEY
# (08:28:30Z). שני השמות מתקבלים: HEADCORNER הקנוני מועדף אם יימסר,
# MAIN_KEY ככינוי שהמפעיל בחר. מדידת הלב הוכיחה ש-MAIN_KEY אינו סיסמת
# החותם (BEAT-ERROR אימות, ריצה 35581200547) - הבדיקה הזו היא שתקבע
# מה המפתח באמת, בפסק-דין כנה ומפורסם.
#
# אפשר להפעיל ידנית בכל רגע (workflow_dispatch). הערך עצמו לעולם לא
# מופיע בלוג, בדיסק או בקבלה.

name: key-verify

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: key-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Refuse honestly when the operator key is absent
        env:
          HEADCORNER: ${{ secrets.HEADCORNER || secrets.MAIN_KEY }}
        run: |
          if [ -z "$HEADCORNER" ]; then
            echo "Neither HEADCORNER nor MAIN_KEY is set in this repository's vault (Settings > Secrets and variables > Actions)."
            echo "The canonical name is preferred; MAIN_KEY is the operator's delivered alias (2026-09-21, both accepted)."
            echo "The operator adds the key; the machine refuses to run without it - honestly, without touching anything."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sodium (sealing into the engine vault)
        run: npm install --prefix /tmp/sodium libsodium-wrappers@0.7.15

      - name: Verify the operator key against the live chain
        env:
          HEADCORNER: ${{ secrets.HEADCORNER || secrets.MAIN_KEY }}
          AGENTS_WATCH_TOKEN: ${{ secrets.AGENTS_WATCH_TOKEN }}
          SODIUM_DIR: /tmp/sodium
        run: node agents/key-verify.mjs

      - name: Publish the receipt (verdict, never the value)
        if: always()
        run: |
          if [ ! -f receipts/key-check.json ]; then
            echo "no receipt written - nothing to publish (the verifier wrote nothing; the refusal above was honest)"
            exit 0
          fi
          git add receipts/key-check.json receipts/key-check-log.jsonl
          if ! git diff --cached --quiet; then
            VERDICT="$(node -e 'try{process.stdout.write(require("./receipts/key-check.json").verdict)}catch{process.stdout.write("none")}')"
            git config user.name "key-verify"
            git config user.email "key-verify@users.noreply.github.com"
            for attempt in 1 2 3; do
              git add receipts/key-check.json receipts/key-check-log.jsonl
              git commit -m "key-verify: ${VERDICT} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase origin main
              if git push; then echo "receipt published (attempt ${attempt})"; exit 0; fi
              echo "push failed (attempt ${attempt}); soft-resetting to origin (the receipt stays staged - r70 F-2 fix, never re-run the verifier in a retry: it has vault side effects)"
              git fetch origin
              git reset --soft origin/main
            done
            echo "ERROR: could not publish the receipt after 3 attempts"
            exit 1
          else
            echo "no receipt change to publish"
          fi
