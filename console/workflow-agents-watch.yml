# AGENTS-WATCH - סוכן רישום-הסוכנים (Task 37)
#
# רץ בריפו הבית הציבורי (Domain) כל שעה: שואל את ה-API של גיטהאב את
# המצב האמיתי של כל הסוכנים בכל 15 הריפואים (כולל הבית הזה עצמו)
# ומרענן את agents/registry.json שתצוגת הסוכנים בקונסולה הציבורית
# קוראת. אפס-סנדבוקס, אפס-סודות בקוד - ה-token חי רק ב-Actions Secret
# (AGENTS_WATCH_TOKEN, הוגדר על-ידי הסוכן מהסוד שהמפעיל הניח בתיקיית
# ההעלאות; הערך עצמו מעולם לא מופיע בקוד, בלוג או בקבלה).
# הרישום לעולם לא מתיישן.

name: agents-watch

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agents-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh the agents registry
        env:
          AGENTS_WATCH_TOKEN: ${{ secrets.AGENTS_WATCH_TOKEN }}
        run: node agents/watch.mjs

      - name: Commit if changed
        run: |
          if ! git diff --quiet agents/registry.json agents/gh-snapshot.json; then
            # Pages-quota gate: lastRun timestamps churn every hourly run,
            # forcing a commit (and a Pages build) even when the fleet is
            # semantically identical. Commit only when the agent roster, its
            # states, or the repo set truly change, or when the last committed
            # heartbeat is older than 3h.
            SEM_NOW="$(node -e 'const r=require("./agents/registry.json");console.log(JSON.stringify({n:r.agents.length,s:r.agents.map(a=>a.name+":"+(a.state||"")).sort(),repos:(r.reposWithAgents||[]).length}))' 2>/dev/null || echo x$$)"
            git show HEAD:agents/registry.json > /tmp/prev-reg.json 2>/dev/null \
              && SEM_PREV="$(node -e 'const r=require("/tmp/prev-reg.json");console.log(JSON.stringify({n:r.agents.length,s:r.agents.map(a=>a.name+":"+(a.state||"")).sort(),repos:(r.reposWithAgents||[]).length}))' 2>/dev/null || echo y$$)" \
              || SEM_PREV=""
            LAST_TS="$(git log -1 --format=%cI -- agents/registry.json agents/gh-snapshot.json)"
            LAST_S="$(date -u -d "$LAST_TS" +%s 2>/dev/null || echo 0)"
            AGE_H=$(( ($(date -u +%s) - LAST_S) / 3600 ))
            if [ "$SEM_NOW" = "$SEM_PREV" ] && [ "$AGE_H" -lt 3 ]; then
              echo "fleet semantically unchanged and heartbeat fresh (${AGE_H}h < 3h) - no commit, Pages quota spared"
              exit 0
            fi
            git config user.name "agents-watch"
            git config user.email "agents-watch@users.noreply.github.com"
            for attempt in 1 2 3; do
              git add agents/registry.json agents/gh-snapshot.json
              git commit -m "agents-watch: ${SEM_NOW}"
              git pull --rebase origin main
              if git push; then echo "registry committed (attempt ${attempt})"; exit 0; fi
              echo "push failed (attempt ${attempt}); resetting to origin and re-running the watcher"
              git checkout -- .
              git reset --hard origin/main
              node agents/watch.mjs
            done
            echo "ERROR: could not commit the registry after 3 attempts"
            exit 1
          else
            echo "registry unchanged - nothing to commit"
          fi
