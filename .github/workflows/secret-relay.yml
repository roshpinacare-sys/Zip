# SECRET-RELAY — המכונה באה אל המפתח (R74)
#
# התקרית: המפעיל מסר את WEAVE_STEEM_WIF לכספת Zip (2026-09-21 16:45:59Z)
# אבל מכונת העיגון שצריכה אותו רצה ב-Domain — וסודות של GitHub לעולם
# לא חוצים ריפואים. מות-המכסה בפרטיים מנע גם את הרצה החד-פעמית של
# המכונה של Zip עצמה (חתימת 3-שניות/אפס-צעדים, נמדד 18:47:57Z).
#
# הריליי: ריצה אחת בתוך Zip (היכן שהערך חי) קוראת אותו מה-env שלה,
# אוטמת אותו במפתח-הציבורי של Domain (sealed-box, אותו תבנית key-verify)
# ומניחה אותו בכספת Domain. משם והלאה התאום הדו-שעתי (:33) נושא את
# קו העדות על דקות ציבוריות — בלתי מוגבלות, חסינות-מכסה.
#
# כשמותר (הפעלה ידנית בלבד — שום קדנס, שום שריפת דקות):
#   Actions > secret-relay > Run workflow
# דורש: WEAVE_STEEM_WIF בכספת הזו ✓ (נמסר) + WEAVE_OPS_PAT עם admin
# על Domain. אם ה-PAT חסר הרשאה — הסירוב כנה עם ההוראה הידנית.
#
# משמורת: הערך עובר כספת-מפעיל → כספת-מפעיל בתוך אותו ארגון, בתוך
# מעטפת-ההצפנה של GitHub עצמו. לא מודפס, לא נרשם, לא נכתב לדיסק.

name: secret-relay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sodium
        run: npm install --prefix /tmp/sodium libsodium-wrappers@0.7.15

      - name: Relay WEAVE_STEEM_WIF → Domain vault (sealed-box, one-shot)
        env:
          WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
          RELAY_SOURCE: WEAVE_STEEM_WIF
          WEAVE_OPS_PAT: ${{ secrets.WEAVE_OPS_PAT }}
          SODIUM_DIR: /tmp/sodium
        run: node scripts/secret-relay.mjs
